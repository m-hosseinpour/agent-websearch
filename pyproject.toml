[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-websearch"
version = "0.1.0"
description = "Local web-search service for agents: MCP and REST, pluggable backends, per-backend errors, tunnel-aware egress"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahdi Hosseinpour" }]
keywords = ["mcp", "web-search", "search", "agents", "xray", "proxy"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=1.0",
  "pydantic>=2.7",
]

[project.scripts]
websearch = "websearch.cli:main"

[project.entry-points."websearch.backends"]
tinyfish = "websearch.backends.tinyfish:TinyFishBackend"
ddg = "websearch.backends.ddg:DdgBackend"
mwmbl = "websearch.backends.mwmbl:MwmblBackend"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
